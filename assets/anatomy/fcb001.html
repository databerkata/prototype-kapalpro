.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

`;

const P = {"origin":[350,232.89226451143426],"scale":7.696361815610831,"azimuth":45,"elevation":30};
const TIP = [27.3, 0.55, 27.8];
const WL = 10;
const hoist = document.querySelector('[data-hoist]');
const hdot = document.querySelector('[data-hoist-dot]');
const hookG = document.querySelector('[data-hook]');
const stage = document.querySelector('.iso-stage');
const still = matchMedia('(prefers-reduced-motion: reduce)');
const f = (p) => p[0].toFixed(1) + ',' + p[1].toFixed(1);
const sp = (w) => { const p = iso(w, P); return [p[0], p[1]]; };
const tipS = sp(TIP);
const restTop = sp([TIP[0], 0.55, TIP[2] - WL]);
let frame = 0, visible = false, last = 0;
function draw(a) {
  const hx = TIP[0] + WL * Math.sin(a), hz = TIP[2] - WL * Math.cos(a);
  const top = sp([hx, 0.55, hz]);
  hoist.setAttribute('d', 'M' + f(tipS) + 'L' + f(top));
  hdot.setAttribute('cx', top[0].toFixed(1));
  hdot.setAttribute('cy', top[1].toFixed(1));
  hookG.setAttribute('transform', 'translate(' + (top[0] - restTop[0]).toFixed(1) + ',' + (top[1] - restTop[1]).toFixed(1) + ')');
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now;
  draw(0.035 * Math.sin((now / 1000) * 2 * Math.PI / 7.5));
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: '120px 0px' }).observe(stage);
if (still.matches) draw(0);
</script></body></html>
