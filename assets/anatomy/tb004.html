const P = {"origin":[346.8822566523279,245.33162345320935],"scale":15.038491361867138,"azimuth":45,"elevation":30};
const bar = document.querySelector('[data-radarbar]');
const barLine = document.querySelector('[data-radarbar-line]');
const stage = document.querySelector('.iso-stage');
const still = matchMedia('(prefers-reduced-motion: reduce)');
const CX = -7.139, CY = 0, ZB = 6.513, HL = 0.827, HW = 0.119;
function barD(a) {
  const c = Math.cos(a), s = Math.sin(a);
  const pts = [[HL,HW],[HL,-HW],[-HL,-HW],[-HL,HW]].map(([dx,dy]) => {
    const p = iso([CX + dx*c - dy*s, CY + dx*s + dy*c, ZB], P);
    return p[0].toFixed(1) + ',' + p[1].toFixed(1);
  });
  return 'M' + pts.join('L') + 'Z';
}
let ang = 0.6, last = 0, frame = 0, visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
  last = now;
  ang += dt * (Math.PI * 2 / 9); // one sweep per 9 s
  const d = barD(ang);
  bar.setAttribute('d', d);
  barLine.setAttribute('d', d);
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((es) => { visible = es[es.length-1].isIntersecting; if (visible) run(); }, { rootMargin: '120px 0px' }).observe(stage);
