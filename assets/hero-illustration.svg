<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ilustrasi kapal tugs men towing tongkang">
  <!-- WHY viewBox 4:3 persis (1200x900): .hero-image di css/style.css
       memakai aspect-ratio 4/3 + object-fit: cover, jadi ukuran ini
       membuat tidak ada satu pun bagian gambar yang terpotong. -->
  <title>Kapal tugs men towing tongkang</title>

  <!-- Langit -->
  <rect width="1200" height="900" fill="#eff6ff"/>
  <circle cx="990" cy="162" r="78" fill="#fde68a" opacity="0.9"/>
  <ellipse cx="248" cy="142" rx="112" ry="34" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="430" cy="104" rx="72" ry="24" fill="#ffffff" opacity="0.65"/>

  <!-- Burung -->
  <path d="M700 214q22-18 44 0 22-18 44 0" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <path d="M852 268q16-13 32 0 16-13 32 0" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Bukit di kejauhan -->
  <path d="M0 528c140-58 300-48 420-8 140-55 340-55 480 0 110-30 210-24 300 8v42H0Z" fill="#dbeafe"/>
  <path d="M0 548c200-40 380-30 560 0 200-38 420-36 640 0v32H0Z" fill="#c7d2fe"/>

  <!-- Laut -->
  <rect y="576" width="1200" height="324" fill="#93c5fd"/>
  <path d="M0 792c200-30 420-20 620 0 200 20 380 0 580-20v128H0Z" fill="#60a5fa"/>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.7">
    <path d="M110 646q60-18 120 0t120 0"/>
    <path d="M756 622q55-16 110 0t110 0"/>
    <path d="M286 752q70-20 140 0t140 0"/>
    <path d="M812 862q60-18 120 0t120 0"/>
  </g>


  <!-- WHY tongkang digeser +26px ke kanan: kedua kapal jadi terasa
       berderet diagonal (tugs lebih dekat, tongkang sedikit menjauh)
       dan bukan menempel berdempet seperti satu objek. -->
  <g transform="translate(26 4)">
    <!-- Badan tongkang: satu siluet, halu condong ke kanan -->
    <path d="M716 726h334l76 20-18 28H716Z" fill="#1e3a8a"/>
    <rect x="716" y="716" width="330" height="12" rx="6" fill="#2563eb"/>
    <!-- Rumah dek + muatan -->
    <rect x="736" y="652" width="98" height="64" rx="12" fill="#f8fafc"/>
    <rect x="748" y="666" width="74" height="22" rx="7" fill="#1d4ed8"/>
    <rect x="736" y="698" width="98" height="12" fill="#0d9488"/>
    <rect x="856" y="664" width="88" height="52" rx="9" fill="#0d9488"/>
    <rect x="954" y="664" width="88" height="52" rx="9" fill="#2563eb"/>
    <rect x="856" y="678" width="88" height="10" rx="5" fill="#0f766e" opacity="0.5"/>
    <rect x="954" y="678" width="88" height="10" rx="5" fill="#93c5fd" opacity="0.75"/>
  </g>

  <!-- WHY halu kapal tugs menyatu dalam satu path: versi sebelumnya
       memakai segitiga terpisah yang terbaca seperti sirip
       atau panah, bukan bentuk kapal. -->
  <g>
    <path d="M270 688h286l104 26-56 38H300q-30 0-30-30Z" fill="#1e40af"/>
    <rect x="288" y="700" width="276" height="13" rx="7" fill="#3b82f6"/>
    <rect x="332" y="600" width="182" height="88" rx="15" fill="#f8fafc"/>
    <rect x="350" y="620" width="36" height="32" rx="7" fill="#1d4ed8"/>
    <rect x="408" y="620" width="36" height="32" rx="7" fill="#1d4ed8"/>
    <rect x="466" y="620" width="36" height="32" rx="7" fill="#1d4ed8"/>
    <rect x="392" y="544" width="112" height="56" rx="13" fill="#f8fafc"/>
    <rect x="404" y="558" width="88" height="26" rx="8" fill="#1d4ed8"/>
    <rect x="443" y="446" width="9" height="98" fill="#475569"/>
    <rect x="408" y="466" width="78" height="9" rx="5" fill="#475569"/>
    <path d="M447 446l44 14-44 14Z" fill="#0d9488"/>
    <rect x="286" y="618" width="46" height="70" rx="9" fill="#0d9488"/>
    <rect x="286" y="618" width="46" height="12" fill="#0f766e"/>
  </g>

  <!-- WHY tali towing digambar paling akhir dengan dua lapis (outline gelap
       + inti terang): kalau hanya satu warna, tali hilang di atas laut
       terang maupun di atas badan kapal yang sama-sama biru tua, dan kalau
       digambar lebih dulu pangkalnya tertutup badan tugs. Lengkungannya
       turun seperti katener tali yang kendur, bukan garis lurus. -->
  <g fill="none" stroke-linecap="round">
    <path d="M628 698q58 30 116 24" stroke="#0f172a" stroke-width="11" opacity="0.55"/>
    <path d="M628 698q58 30 116 24" stroke="#f8fafc" stroke-width="5"/>
  </g>

  <!-- Busa di belakang kapal -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="214" cy="768" rx="86" ry="16"/>
    <ellipse cx="1150" cy="790" rx="52" ry="12"/>
    <ellipse cx="520" cy="800" rx="120" ry="18" opacity="0.6"/>
  </g>
</svg>